name: Publish Superskills release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create or refresh
        required: true
        default: v1.0.0
        type: string
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: superskills-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Kukutx/superskills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.0.0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Verify repository
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_repo.py
          python tools/export_behavioral_evals.py --check

      - name: Build release bundle
        run: |
          python tools/build_bundle.py \
            --profile gpts/kukutx \
            --skill writing/resume-writing \
            --output dist/superskills-resume-bundle
          python - <<'PY'
          import shutil

          archive = shutil.make_archive(
              "dist/superskills-resume-bundle",
              "zip",
              root_dir="dist",
              base_dir="superskills-resume-bundle",
          )
          print(archive)
          PY
          sha256sum dist/superskills-resume-bundle.zip > dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<EOF
          # Superskills ${VERSION}

          First stable repository baseline with:

          - confidence-aware clarification before direction-changing work;
          - truthful ATS-safe resume/CV writing;
          - one-primary-Skill routing and progressive disclosure;
          - strict repository validation with regression tests;
          - machine-readable behavioral eval export;
          - reproducible runtime bundles;
          - Python 3.11 and 3.14 CI;
          - MIT licensing.

          Included asset: a ready-to-upload writing/resume-writing runtime bundle bound to commit ${GITHUB_SHA}.
          EOF

      - name: Create or refresh release
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              dist/superskills-resume-bundle.zip \
              dist/SHA256SUMS.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" \
              dist/superskills-resume-bundle.zip \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file dist/release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove merged bootstrap branches
        run: |
          for branch in \
            improve/reliability-resume-skill \
            chore/finalize-public-repo \
            automation/bootstrap-release
          do
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              >/dev/null 2>&1
            then
              echo "Deleted ${branch}"
            else
              echo "Branch absent or could not be deleted: ${branch}"
            fi
          done

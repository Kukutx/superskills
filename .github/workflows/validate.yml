name: Validate superskills

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Test repository tools
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Validate behavioral eval export
        run: python tools/export_behavioral_evals.py --check
      - name: Smoke-test runtime bundle
        run: |
          python tools/build_bundle.py \
            --profile gpts/kukutx \
            --skill writing/resume-writing \
            --output /tmp/superskills-bundle
          test -f /tmp/superskills-bundle/manifest.json
      - name: Smoke-test web packages and live eval suite
        run: |
          python tools/package_web_skills.py --output /tmp/superskills-claude-web
          python tools/build_live_evals.py
          test -f dist/live-evals/.claude-plugin/plugin.json

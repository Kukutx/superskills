name: Finalize clean v1 release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/finalize-clean-v1.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'Kukutx/superskills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: v1.0.0
      SELF_PATH: .github/workflows/finalize-clean-v1.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Remove this one-time workflow
        id: clean
        run: |
          FILE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$SELF_PATH?ref=master" --jq '.sha')
          CLEAN_SHA=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$SELF_PATH" \
            -f message='Remove one-time v1 finalizer' \
            -f sha="$FILE_SHA" \
            -f branch='master' \
            --jq '.commit.sha')
          echo "sha=$CLEAN_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout clean master commit
        run: |
          git fetch origin master
          git checkout "${{ steps.clean.outputs.sha }}"

      - name: Verify clean repository
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_repo.py
          python tools/export_behavioral_evals.py --check

      - name: Build clean bundle
        run: |
          python tools/build_bundle.py \
            --profile gpts/kukutx \
            --skill writing/resume-writing \
            --output dist/superskills-resume-bundle
          python - <<'PY'
          import shutil

          print(shutil.make_archive(
              "dist/superskills-resume-bundle",
              "zip",
              root_dir="dist",
              base_dir="superskills-resume-bundle",
          ))
          PY
          (cd dist && sha256sum superskills-resume-bundle.zip > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          CLEAN_SHA="${{ steps.clean.outputs.sha }}"
          cat > dist/release-notes.md <<EOF
          # Superskills v1.0.0

          Clean stable baseline with:

          - confidence-aware clarification before direction-changing work;
          - truthful ATS-safe resume/CV writing;
          - one-primary-Skill routing and progressive disclosure;
          - strict repository validation with regression tests;
          - one canonical behavioral-eval schema;
          - machine-readable behavioral eval export;
          - reproducible runtime bundles;
          - Python 3.14 tooling and CI;
          - MIT licensing.

          Included asset: writing/resume-writing runtime bundle built from commit ${CLEAN_SHA}.
          EOF

      - name: Replace v1 release at clean commit
        run: |
          CLEAN_SHA="${{ steps.clean.outputs.sha }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$VERSION" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          else
            git push origin ":refs/tags/$VERSION" >/dev/null 2>&1 || true
          fi
          gh release create "$VERSION" \
            dist/superskills-resume-bundle.zip \
            dist/SHA256SUMS.txt \
            --target "$CLEAN_SHA" \
            --title "$VERSION" \
            --notes-file dist/release-notes.md \
            --repo "$GITHUB_REPOSITORY"
